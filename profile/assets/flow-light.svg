<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How a bonded SLA works</title>
  <desc id="d">Flow diagram. The seller stakes a bond. The buyer commits volume. Both sides log every request. The verifier settles. If the claim held, the bond returns to the seller. If the claim was missed, the buyer is paid automatically.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect width="1000" height="300" rx="8" fill="#fcfcfb"/>
  <rect x="24" y="118" width="150" height="64" rx="8" fill="#efeee9" stroke="#e7e6e1" stroke-width="1.5"/><text x="99" y="146" text-anchor="middle" font-size="14" fill="#0b0b0b">Seller stakes</text><text x="99" y="165" text-anchor="middle" font-size="14" fill="#0b0b0b">a bond</text>
  <rect x="208" y="118" width="150" height="64" rx="8" fill="#efeee9" stroke="#e7e6e1" stroke-width="1.5"/><text x="283" y="146" text-anchor="middle" font-size="14" fill="#0b0b0b">Buyer commits</text><text x="283" y="165" text-anchor="middle" font-size="14" fill="#0b0b0b">volume</text>
  <rect x="392" y="118" width="150" height="64" rx="8" fill="#efeee9" stroke="#e7e6e1" stroke-width="1.5"/><text x="467" y="146" text-anchor="middle" font-size="14" fill="#0b0b0b">Both sides log</text><text x="467" y="165" text-anchor="middle" font-size="14" fill="#0b0b0b">every request</text>
  <rect x="576" y="118" width="150" height="64" rx="8" fill="#efeee9" stroke="#2a78d6" stroke-width="2"/><text x="651" y="146" text-anchor="middle" font-size="14" fill="#0b0b0b">Verifier</text><text x="651" y="165" text-anchor="middle" font-size="14" fill="#0b0b0b">settles</text>
  <path d="M178,150 H202" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M362,150 H386" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M546,150 H570" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M730,150 H760 V78 H794" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><text x="888" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#52514e">Claim held</text><rect x="800" y="46" width="176" height="64" rx="8" fill="#efeee9" stroke="#e7e6e1" stroke-width="1.5"/><text x="888" y="74" text-anchor="middle" font-size="14" fill="#0b0b0b">Bond returns</text><text x="888" y="93" text-anchor="middle" font-size="14" fill="#0b0b0b">to the seller</text>
  <path d="M730,150 H760 V222 H794" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><text x="888" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#52514e">Claim missed</text><rect x="800" y="190" width="176" height="64" rx="8" fill="#efeee9" stroke="#e7e6e1" stroke-width="1.5"/><text x="888" y="218" text-anchor="middle" font-size="14" fill="#0b0b0b">Buyer is paid</text><text x="888" y="237" text-anchor="middle" font-size="14" fill="#0b0b0b">automatically</text>
</svg>
