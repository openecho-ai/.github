  <circle cx="230.00" cy="316.53" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="218.00" y="306.53" text-anchor="end" font-size="13" font-weight="600" fill="#f0efec">5% missed pays $6.12</text>
  <circle cx="396.00" cy="244.08" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="384.00" y="234.08" text-anchor="end" font-size="13" font-weight="600" fill="#f0efec">10% missed pays $16.33</text>
