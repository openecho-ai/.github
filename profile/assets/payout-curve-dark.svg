<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Bond payout per epoch by shortfall</title>
  <desc id="desc">Line chart for the example offer. The payout is zero while up to 2% of in-envelope requests miss the claim. Past that it rises in a straight line: 5% missed pays $6.12, 10% pays $16.33, and 20% pays $36.73. It reaches the $200 daily cap at total failure.</desc>
  <rect width="760" height="420" rx="8" fill="#1a1a19"/>
  <text x="64" y="32" font-size="17" font-weight="600" fill="#f0efec">Bond payout per epoch by shortfall</text>
  <text x="64" y="53" font-size="13" fill="#c3c2b7">Example offer. No payout inside the 2% deadband, then a straight line to the $200 daily cap at total failure.</text>
  <rect x="64.00" y="76" width="66.40" height="284" fill="#262624"/>
  <line x1="64" x2="728" y1="360.00" y2="360.00" stroke="#5a5953" stroke-width="1"/><text x="54" y="364.00" text-anchor="end" font-size="12" fill="#c3c2b7">$0</text>
  <line x1="64" x2="728" y1="289.00" y2="289.00" stroke="#2e2e2b" stroke-width="1"/><text x="54" y="293.00" text-anchor="end" font-size="12" fill="#c3c2b7">$10</text>
  <line x1="64" x2="728" y1="218.00" y2="218.00" stroke="#2e2e2b" stroke-width="1"/><text x="54" y="222.00" text-anchor="end" font-size="12" fill="#c3c2b7">$20</text>
  <line x1="64" x2="728" y1="147.00" y2="147.00" stroke="#2e2e2b" stroke-width="1"/><text x="54" y="151.00" text-anchor="end" font-size="12" fill="#c3c2b7">$30</text>
  <line x1="64" x2="728" y1="76.00" y2="76.00" stroke="#2e2e2b" stroke-width="1"/><text x="54" y="80.00" text-anchor="end" font-size="12" fill="#c3c2b7">$40</text>
  <text x="97.20" y="92" text-anchor="middle" font-size="11" fill="#c3c2b7">deadband</text>
  <text x="64.00" y="380" text-anchor="middle" font-size="12" fill="#c3c2b7">0%</text>
  <text x="230.00" y="380" text-anchor="middle" font-size="12" fill="#c3c2b7">5%</text>
  <text x="396.00" y="380" text-anchor="middle" font-size="12" fill="#c3c2b7">10%</text>
  <text x="562.00" y="380" text-anchor="middle" font-size="12" fill="#c3c2b7">15%</text>
  <text x="728.00" y="380" text-anchor="middle" font-size="12" fill="#c3c2b7">20%</text>
  <text x="396.00" y="406" text-anchor="middle" font-size="12" fill="#c3c2b7">Share of in-envelope requests that missed the claim</text>
